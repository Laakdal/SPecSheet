[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
flate2 = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Game files are large; keep debug builds responsive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
