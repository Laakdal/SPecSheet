[workspace]
resolver = "2"
members = ["crates/*", "app/specsheet"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
flate2 = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Game files are large; keep debug builds responsive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
