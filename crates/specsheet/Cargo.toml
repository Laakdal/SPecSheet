[package]
name = "specsheet"
version = "0.1.0"
description = "SpecSheet: standalone ETS2 truck tuning viewer (Bevy + egui)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
specsheet-core = { path = "../specsheet-core" }
specsheet-assembly = { path = "../specsheet-assembly" }
specsheet-data = { path = "../specsheet-data" }
specsheet-gameui = { path = "../specsheet-gameui" }
specsheet-session = { path = "../specsheet-session" }
specsheet-theme = { path = "../specsheet-theme" }
specsheet-truck = { path = "../specsheet-truck" }
bevy = { version = "0.19.1", default-features = false, features = ["3d"] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
