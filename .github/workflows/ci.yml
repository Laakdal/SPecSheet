# Checks every push to main and every pull request. Real-install tests need
# the game files, which CI doesn't have, so they skip themselves here and are
# run locally with ETS2_DIR set (docs/DEVELOPMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Guard, format, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse game files
        run: python tools/check_public_tree.py --all

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
