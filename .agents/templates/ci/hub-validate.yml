# Copy to .github/workflows/hub-validate.yml to check hub files on every PR.
name: hub validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated platform files are up to date
        run: python .agents/tools/hub sync --check
      - name: Structure, budgets, links, schemas
        run: python .agents/tools/hub validate
