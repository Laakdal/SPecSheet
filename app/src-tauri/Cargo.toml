[package]
name = "ets2-tuning-app"
version = "0.1.0"
description = "Standalone ETS2 truck tuning viewer (Tauri backend)."
edition.workspace = true
rust-version = "1.90"
license.workspace = true
publish.workspace = true

[lib]
name = "ets2_tuning_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
game-data = { path = "../../crates/game-data" }
tuning-core = { path = "../../crates/tuning-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10", features = [] }
thiserror.workspace = true

[lints]
workspace = true
